<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Z9 Innovation</title>
  <meta name="description" content="Z9 Innovation LLC — advanced technology and innovation consulting.">
  <meta name="theme-color" content="#0d1224">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #e9e6df;
      --card: #fbfaf7;
      --ink: #0d1224;
      --muted: #5d6275;
      --rule: rgba(13, 18, 36, 0.12);
      --shadow: 0 1px 2px rgba(13,18,36,.06), 0 12px 40px rgba(13,18,36,.12);
      --accent: #3fd8ff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --page: #05070d;
        --card: #0d1224;
        --ink: #f1ede4;
        --muted: #9aa0b4;
        --rule: rgba(241, 237, 228, 0.12);
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 20px 60px rgba(0,0,0,.5);
      }
    }
    :root[data-theme="dark"] {
      --page: #05070d;
      --card: #0d1224;
      --ink: #f1ede4;
      --muted: #9aa0b4;
      --rule: rgba(241, 237, 228, 0.12);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 20px 60px rgba(0,0,0,.5);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 1000px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: clamp(24px, 4vw, 44px) clamp(16px, 4vw, 44px) clamp(20px, 3vw, 32px);
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 1.6vw, 16px);
      margin-bottom: clamp(20px, 3vw, 32px);
    }
    .logo {
      width: clamp(150px, 26vw, 230px);
      aspect-ratio: 720 / 411;
      background: var(--ink);
      -webkit-mask: url(logo.png) center / contain no-repeat;
              mask: url(logo.png) center / contain no-repeat;
    }
    .wordmark {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: clamp(18px, 2.6vw, 26px);
      letter-spacing: 0.62em;
      margin-right: -0.62em; /* balance trailing letter-spacing */
      line-height: 1;
    }
    .screen {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #04060c;
      box-shadow: inset 0 0 0 1px rgba(63,216,255,.14), 0 0 0 1px var(--rule);
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      touch-action: none;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas.playing { cursor: none; }
    .mute {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(63,216,255,.25);
      border-radius: 8px;
      background: rgba(4,6,12,.6);
      color: #9fe9ff;
      cursor: pointer;
      padding: 0;
    }
    .mute:hover { border-color: rgba(63,216,255,.6); }
    .mute svg { width: 16px; height: 16px; }
    .mute .off { display: none; }
    .mute[aria-pressed="true"] .on { display: none; }
    .mute[aria-pressed="true"] .off { display: block; }
    .help {
      margin: 10px 0 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .help kbd {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 1px 5px;
    }
    footer {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 24px;
      margin-top: clamp(20px, 3vw, 28px);
      padding-top: 18px;
      border-top: 1px solid var(--rule);
    }
    .company { margin: 0; font-size: 15px; }
    .company strong { font-weight: 500; }
    .company span { color: var(--muted); }
    .email {
      color: var(--ink);
      font-size: 15px;
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1px;
    }
    .email:hover { border-bottom-color: var(--ink); }
    @media (max-width: 560px) {
      footer { flex-direction: column; align-items: center; text-align: center; }
      .help .desk { display: none; }
      .mute { width: 26px; height: 26px; right: 6px; bottom: 6px; border-radius: 6px; }
      .mute svg { width: 13px; height: 13px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="brand">
      <div class="logo" role="img" aria-label="Z9"></div>
      <h1 class="wordmark">INNOVATION</h1>
    </header>

    <div class="screen">
      <canvas id="game" aria-label="Z9 Perimeter, a playable missile-defense game"></canvas>
      <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Mute sound">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
      </button>
    </div>
    <p class="help">Click or tap the sky to launch an interceptor<span class="desk"> &middot; <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> fire from a specific battery &middot; <kbd>P</kbd> pause</span></p>

    <footer>
      <p class="company"><strong>Z9 Innovation LLC</strong> <span>&middot; Advanced technology &amp; innovation consulting</span></p>
      <a class="email" href="mailto:rothfuss@z9i.com">rothfuss@z9i.com</a>
    </footer>
  </main>

<script>
(() => {
  'use strict';

  // ---------- Canvas setup ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 960, H = 600, GROUND = 556;
  let scale = 1;
  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    scale = canvas.width / W;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const MONO = '"JetBrains Mono", ui-monospace, monospace';

  // ---------- Palette ----------
  const C = {
    sky0: '#04060c', sky1: '#0a1430',
    cyan: '#3fd8ff', cyanSoft: 'rgba(63,216,255,', ice: '#e8fbff',
    threat: 'rgba(255,72,112,', threatHead: '#ff8fa8',
    seeker: 'rgba(255,184,77,', seekerHead: '#ffd9a0',
    ground: '#0a1122', groundLine: 'rgba(63,216,255,0.55)',
    tower: '#16305a', window: '#9fe9ff',
  };

  // ---------- World layout ----------
  const HUB_X = [190, 280, 370, 590, 680, 770];
  const BAT_X = [70, 480, 890];
  const BAT_Y = GROUND - 26;
  const AMMO = 10;
  const SHOT_SPEED = 640;

  // Fixed skyline for each hub so it doesn't flicker between frames
  const skylines = HUB_X.map((_, i) => {
    const towers = [];
    let x = -22;
    let seed = (i + 1) * 9301;
    const rnd = () => { seed = (seed * 49297 + 233280) % 233280; return seed / 233280; };
    while (x < 18) {
      const w = 6 + Math.floor(rnd() * 5);
      towers.push({ x, w, h: 12 + Math.floor(rnd() * 22) });
      x += w + 2;
    }
    return towers;
  });

  const stars = Array.from({ length: 140 }, () => ({
    x: Math.random() * W, y: Math.random() * (GROUND - 80),
    r: Math.random() < 0.85 ? 0.7 : 1.3, p: Math.random() * Math.PI * 2, s: rand(0.6, 2),
  }));

  // ---------- State ----------
  let hubs, bats, threats, shots, blasts, particles, ghosts, markers;
  let mode = 'attract';  // 'attract' | 'playing' | 'gameover'
  let phase = 'wave';    // 'wave' | 'tally'
  let score = 0, wave = 0, mult = 1, nextBonus = 10000;
  let spawnQueue = 0, spawnTimer = 0, tallyTimer = 0, tally = null;
  let banner = null, shake = 0, time = 0, overTimer = 0, demoOverTimer = 0, aiTimer = 0;
  let paused = false;
  let pointer = { x: W / 2, y: GROUND / 2, inside: false };
  let high = 0;
  try { high = parseInt(localStorage.getItem('z9-perimeter-high') || '0', 10) || 0; } catch (e) {}

  function newGame(demo) {
    mode = demo ? 'attract' : 'playing';
    hubs = HUB_X.map(x => ({ x, alive: true }));
    bats = BAT_X.map(x => ({ x, ammo: AMMO, alive: true }));
    threats = []; shots = []; blasts = []; particles = []; ghosts = []; markers = [];
    score = 0; wave = 0; nextBonus = 10000; overTimer = 0; demoOverTimer = 0;
    canvas.classList.toggle('playing', !demo);
    startWave();
  }

  function startWave() {
    wave++;
    mult = Math.min(1 + Math.floor((wave - 1) / 2), 6);
    bats.forEach(b => { b.alive = true; b.ammo = AMMO; });
    spawnQueue = Math.min(10 + wave * 2, 34);
    spawnTimer = 1.8;
    phase = 'wave';
    banner = { text: 'WAVE ' + wave, sub: mult > 1 ? mult + '× POINTS' : 'DEFEND THE GRID', t: 2 };
    if (mode === 'playing') sfx.wave();
  }

  function threatSpeed() { return Math.min(30 + wave * 7, 125); }

  function pickTarget() {
    const all = hubs.map(h => ({ x: h.x, alive: h.alive })).concat(bats.map(b => ({ x: b.x, alive: b.alive })));
    const alive = all.filter(t => t.alive);
    return (alive.length && Math.random() < 0.8) ? pick(alive) : pick(all);
  }

  function spawnThreat(sx, sy, kind, depth) {
    const tgt = pickTarget();
    const tx = tgt.x + rand(-8, 8), ty = GROUND - 4;
    let speed = threatSpeed() * rand(0.85, 1.15);
    if (kind === 'seeker') speed *= 1.7;
    const d = Math.hypot(tx - sx, ty - sy);
    const t = {
      sx, sy, x: sx, y: sy, tx, ty, kind,
      vx: (tx - sx) / d * speed, vy: (ty - sy) / d * speed,
      split: null, targeted: false,
    };
    if (kind === 'normal' && depth === 0 && wave >= 2 && Math.random() < Math.min(0.12 + wave * 0.03, 0.4)) {
      t.split = rand(150, 320);
    }
    threats.push(t);
  }

  function spawnFromSky() {
    const kind = (wave >= 4 && Math.random() < Math.min(0.06 + wave * 0.015, 0.22)) ? 'seeker' : 'normal';
    spawnThreat(rand(20, W - 20), -4, kind, 0);
  }

  function ghostOf(t) {
    ghosts.push({ sx: t.sx, sy: t.sy, x: t.x, y: t.y, kind: t.kind, a: 1 });
  }

  // ---------- Player actions ----------
  function fire(x, y, batIndex) {
    if (paused) return false;
    y = Math.min(y, GROUND - 40);
    let bat = null;
    if (batIndex != null) {
      const b = bats[batIndex];
      if (b.alive && b.ammo > 0) bat = b;
    } else {
      let best = Infinity;
      for (const b of bats) {
        if (!b.alive || b.ammo <= 0) continue;
        const d = Math.abs(b.x - x);
        if (d < best) { best = d; bat = b; }
      }
    }
    if (!bat) { if (mode === 'playing') sfx.empty(); return false; }
    bat.ammo--;
    const sx = bat.x, sy = BAT_Y - 6;
    const d = Math.hypot(x - sx, y - sy);
    shots.push({ sx, sy, x: sx, y: sy, tx: x, ty: y, vx: (x - sx) / d * SHOT_SPEED, vy: (y - sy) / d * SHOT_SPEED, left: d });
    markers.push({ x, y, t: 0 });
    if (mode === 'playing') sfx.launch();
    return true;
  }

  function addBlast(x, y, max, kind) {
    blasts.push({ x, y, max, kind, t: 0, r: 0 });
  }

  function burst(x, y, n, color, speed, life) {
    if (particles.length > 700) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(0.2, 1) * speed;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.2, life: rand(0.5, 1) * life, max: life, color });
    }
  }

  function killThreat(i) {
    const t = threats[i];
    threats.splice(i, 1);
    ghostOf(t);
    addBlast(t.x, t.y, 24, 'chain');
    burst(t.x, t.y, 12, t.kind === 'seeker' ? '255,200,120' : '255,120,150', 120, 0.8);
    if (mode === 'playing') {
      score += (t.kind === 'seeker' ? 50 : 25) * mult;
      sfx.pop();
    }
  }

  function impact(t) {
    ghostOf(t);
    addBlast(t.x, t.y, 30, 'ground');
    burst(t.x, t.y, 22, '255,140,90', 160, 1.1);
    let hit = false;
    for (const h of hubs) {
      if (h.alive && Math.abs(h.x - t.x) < 30) {
        h.alive = false; hit = true;
        burst(h.x, GROUND - 14, 40, '159,233,255', 200, 1.4);
      }
    }
    for (const b of bats) {
      if (b.alive && Math.abs(b.x - t.x) < 34) {
        b.alive = false; b.ammo = 0; hit = true;
        burst(b.x, BAT_Y, 30, '159,233,255', 180, 1.2);
      }
    }
    if (!reduceMotion) shake = Math.max(shake, hit ? 9 : 4);
    if (mode === 'playing') sfx.boom(hit);
  }

  function endWave() {
    const ammoLeft = bats.reduce((s, b) => s + (b.alive ? b.ammo : 0), 0);
    const hubsLeft = hubs.filter(h => h.alive).length;
    const ammoBonus = ammoLeft * 5 * mult, hubBonus = hubsLeft * 100 * mult;
    let restored = false;
    if (mode === 'playing') {
      score += ammoBonus + hubBonus;
      while (score >= nextBonus) {
        nextBonus += 10000;
        const dead = hubs.find(h => !h.alive);
        if (dead) { dead.alive = true; restored = true; }
      }
    }
    tally = { ammoLeft, hubsLeft, ammoBonus, hubBonus, restored };
    phase = 'tally';
    tallyTimer = mode === 'playing' ? 3.2 : 1.6;
    if (mode === 'playing') sfx.clear();
  }

  function gameOver() {
    mode = 'gameover';
    overTimer = 0;
    spawnQueue = 0;
    canvas.classList.remove('playing');
    if (score > high) {
      high = score;
      try { localStorage.setItem('z9-perimeter-high', String(high)); } catch (e) {}
    }
    sfx.over();
  }

  // ---------- Demo AI ----------
  function runAI(dt) {
    aiTimer -= dt;
    if (aiTimer > 0 || phase !== 'wave') return;
    aiTimer = rand(0.25, 0.55);
    const cands = threats.filter(t => !t.targeted && t.y > 40).sort((a, b) => b.y - a.y);
    for (const t of cands) {
      let best = null, bd = Infinity;
      for (const b of bats) if (b.alive && b.ammo > 0 && Math.abs(b.x - t.x) < bd) { bd = Math.abs(b.x - t.x); best = b; }
      if (!best) return;
      let px = t.x, py = t.y;
      for (let k = 0; k < 3; k++) {
        const tt = Math.hypot(px - best.x, py - BAT_Y) / SHOT_SPEED + 0.18;
        px = t.x + t.vx * tt; py = t.y + t.vy * tt;
      }
      if (py > GROUND - 50) continue;
      if (fire(px + rand(-6, 6), py + rand(-6, 6), bats.indexOf(best))) {
        t.targeted = true;
        threats.forEach(o => { if (Math.hypot(o.x - t.x, o.y - t.y) < 30) o.targeted = true; });
      }
      return;
    }
  }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 22);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

    if (mode !== 'gameover') {
      if (phase === 'wave') {
        if (spawnQueue > 0) {
          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            const n = Math.min(spawnQueue, Math.random() < 0.3 ? 2 : 1);
            for (let i = 0; i < n; i++) spawnFromSky();
            spawnQueue -= n;
            spawnTimer = rand(0.5, 1.7) * Math.max(0.35, 1 - wave * 0.06);
          }
        } else if (!threats.length && !shots.length && !blasts.length) {
          endWave();
        }
      } else if (phase === 'tally') {
        tallyTimer -= dt;
        if (tallyTimer <= 0) { tally = null; startWave(); }
      }
    }
    if (mode === 'attract') runAI(dt);

    // Threats
    for (let i = threats.length - 1; i >= 0; i--) {
      const t = threats[i];
      t.x += t.vx * dt; t.y += t.vy * dt;
      if (t.split != null && t.y >= t.split) {
        threats.splice(i, 1);
        ghostOf(t);
        const n = Math.random() < 0.5 ? 2 : 3;
        for (let k = 0; k < n; k++) spawnThreat(t.x, t.y, 'normal', 1);
        burst(t.x, t.y, 6, '255,120,150', 60, 0.5);
        continue;
      }
      if (t.y >= t.ty) { threats.splice(i, 1); impact(t); }
    }

    // Interceptors
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      const step = SHOT_SPEED * dt;
      s.left -= step;
      if (s.left <= 0) {
        shots.splice(i, 1);
        addBlast(s.tx, s.ty, 44, 'player');
        markers = markers.filter(m => !(m.x === s.tx && m.y === s.ty));
        if (mode === 'playing') sfx.blast();
      } else {
        s.x += s.vx * dt; s.y += s.vy * dt;
      }
    }

    // Blasts: grow, hold, fade
    for (let i = blasts.length - 1; i >= 0; i--) {
      const b = blasts[i];
      b.t += dt;
      const g = 0.32, hld = 0.14, f = 0.5;
      if (b.t < g) b.r = b.max * (1 - Math.pow(1 - b.t / g, 3));
      else if (b.t < g + hld) b.r = b.max;
      else if (b.t < g + hld + f) b.r = b.max * (1 - (b.t - g - hld) / f);
      else { blasts.splice(i, 1); continue; }
      if (b.kind !== 'ground') {
        const r2 = b.r * b.r;
        for (let j = threats.length - 1; j >= 0; j--) {
          const t = threats[j];
          const dx = t.x - b.x, dy = t.y - b.y;
          if (dx * dx + dy * dy < r2) killThreat(j);
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += 140 * dt; p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > GROUND) { p.y = GROUND; p.vy *= -0.3; }
    }
    for (let i = ghosts.length - 1; i >= 0; i--) {
      ghosts[i].a -= dt * 1.6;
      if (ghosts[i].a <= 0) ghosts.splice(i, 1);
    }
    markers.forEach(m => m.t += dt);

    // Embers from ruined hubs
    for (const h of hubs) {
      if (!h.alive && Math.random() < dt * 3 && particles.length < 700) {
        particles.push({ x: h.x + rand(-16, 16), y: GROUND - 4, vx: rand(-8, 8), vy: rand(-40, -20), life: 1, max: 1, color: '255,140,90' });
      }
    }

    const alive = hubs.some(h => h.alive);
    if (!alive) {
      if (mode === 'playing') gameOver();
      else if (mode === 'attract') { demoOverTimer += dt; if (demoOverTimer > 2.5) newGame(true); }
    }
    if (mode === 'gameover') {
      overTimer += dt;
      if (overTimer > 14) newGame(true);
    }
  }

  // ---------- Render ----------
  function trail(sx, sy, x, y, rgba, alpha, width) {
    const g = ctx.createLinearGradient(sx, sy, x, y);
    g.addColorStop(0, rgba + '0)');
    g.addColorStop(0.7, rgba + (0.35 * alpha) + ')');
    g.addColorStop(1, rgba + (0.95 * alpha) + ')');
    ctx.strokeStyle = g;
    ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(x, y); ctx.stroke();
  }

  function glowDot(x, y, r, color, glow) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, glow);
    g.addColorStop(0, color);
    g.addColorStop(0.25, color.replace('1)', '0.5)'));
    g.addColorStop(1, color.replace('1)', '0)'));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, glow, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, C.sky0);
    g.addColorStop(0.75, '#060b1a');
    g.addColorStop(1, C.sky1);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      const a = 0.35 + 0.35 * Math.sin(time * s.s + s.p);
      ctx.fillStyle = 'rgba(220,235,255,' + a + ')';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }

    // Faint horizon grid
    ctx.strokeStyle = 'rgba(63,216,255,0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 48) {
      ctx.beginPath(); ctx.moveTo(x, GROUND - 160); ctx.lineTo(x, GROUND); ctx.stroke();
    }
    for (let y = GROUND - 160; y < GROUND; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    const hz = ctx.createLinearGradient(0, GROUND - 120, 0, GROUND);
    hz.addColorStop(0, 'rgba(63,216,255,0)');
    hz.addColorStop(1, 'rgba(63,216,255,0.10)');
    ctx.fillStyle = hz;
    ctx.fillRect(0, GROUND - 120, W, 120);
  }

  function drawGround() {
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, GROUND);
    for (const bx of BAT_X) {
      ctx.lineTo(bx - 50, GROUND);
      ctx.lineTo(bx - 24, BAT_Y);
      ctx.lineTo(bx + 24, BAT_Y);
      ctx.lineTo(bx + 50, GROUND);
    }
    ctx.lineTo(W, GROUND);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = C.ground;
    ctx.fill();
    ctx.save();
    ctx.shadowColor = C.cyan; ctx.shadowBlur = 10;
    ctx.strokeStyle = C.groundLine; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function drawHubs() {
    hubs.forEach((h, i) => {
      if (h.alive) {
        ctx.save();
        ctx.shadowColor = C.cyan; ctx.shadowBlur = 12;
        for (const tw of skylines[i]) {
          const x = h.x + tw.x, y = GROUND - tw.h;
          const g = ctx.createLinearGradient(0, y, 0, GROUND);
          g.addColorStop(0, '#2a5a9a'); g.addColorStop(1, C.tower);
          ctx.fillStyle = g;
          ctx.fillRect(x, y, tw.w, tw.h);
        }
        ctx.restore();
        ctx.fillStyle = C.window;
        for (const tw of skylines[i]) {
          for (let wy = GROUND - tw.h + 3; wy < GROUND - 3; wy += 4) {
            for (let wx = 1; wx < tw.w - 1; wx += 3) {
              const on = ((wx * 7 + wy * 13 + i * 5) % 9) > 2;
              if (on) { ctx.globalAlpha = 0.55 + 0.25 * Math.sin(time * 1.3 + wx + wy); ctx.fillRect(h.x + tw.x + wx, wy, 1.2, 1.2); }
            }
          }
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = C.cyan;
        ctx.fillRect(h.x - 24, GROUND - 1, 48, 1);
      } else {
        ctx.fillStyle = '#1a1420';
        ctx.beginPath();
        ctx.moveTo(h.x - 24, GROUND);
        ctx.lineTo(h.x - 14, GROUND - 6); ctx.lineTo(h.x - 6, GROUND - 3);
        ctx.lineTo(h.x + 4, GROUND - 8); ctx.lineTo(h.x + 14, GROUND - 4);
        ctx.lineTo(h.x + 24, GROUND);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,120,80,' + (0.3 + 0.2 * Math.sin(time * 3 + h.x)) + ')';
        ctx.fillRect(h.x - 10, GROUND - 3, 3, 2);
        ctx.fillRect(h.x + 6, GROUND - 4, 2, 2);
      }
    });
  }

  function drawBatteries() {
    bats.forEach(b => {
      const x = b.x, y = BAT_Y;
      if (b.alive) {
        ctx.save();
        ctx.shadowColor = C.cyan; ctx.shadowBlur = 14;
        ctx.fillStyle = '#18345e';
        ctx.beginPath(); ctx.arc(x, y, 11, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, 11, Math.PI, 0); ctx.stroke();
        ctx.restore();
        ctx.fillStyle = b.ammo > 0 ? C.ice : 'rgba(255,255,255,0.15)';
        ctx.beginPath(); ctx.arc(x, y - 4, 2.5, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(255,120,80,0.5)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.lineTo(x - 3, y - 6); ctx.lineTo(x + 4, y - 2); ctx.lineTo(x + 10, y); ctx.stroke();
      }
      // Ammo pips: two rows of five
      for (let k = 0; k < AMMO; k++) {
        const row = k < 5 ? 0 : 1, col = k % 5;
        const px = x - 16 + col * 8, py = y + 8 + row * 7;
        ctx.fillStyle = (b.alive && k < b.ammo) ? C.cyan : 'rgba(63,216,255,0.12)';
        ctx.fillRect(px - 1, py, 3, 4);
      }
    });
  }

  function drawProjectiles() {
    ctx.lineCap = 'round';
    for (const g of ghosts) {
      trail(g.sx, g.sy, g.x, g.y, g.kind === 'seeker' ? C.seeker : C.threat, g.a * 0.6, 1.5);
    }
    for (const t of threats) {
      const rgba = t.kind === 'seeker' ? C.seeker : C.threat;
      trail(t.sx, t.sy, t.x, t.y, rgba, 1, t.kind === 'seeker' ? 2 : 1.6);
      glowDot(t.x, t.y, 1.6, rgba + '1)', 9);
    }
    for (const s of shots) {
      trail(s.sx, s.sy, s.x, s.y, C.cyanSoft, 1, 1.6);
      glowDot(s.x, s.y, 1.6, C.cyanSoft + '1)', 8);
    }
    // Target markers
    for (const m of markers) {
      const r = 5, a = 0.5 + 0.5 * Math.sin(m.t * 18);
      ctx.strokeStyle = 'rgba(232,251,255,' + (0.5 + 0.5 * a) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(m.x - r, m.y - r); ctx.lineTo(m.x + r, m.y + r);
      ctx.moveTo(m.x + r, m.y - r); ctx.lineTo(m.x - r, m.y + r);
      ctx.stroke();
    }
  }

  function drawBlasts() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const b of blasts) {
      if (b.r <= 0.5) continue;
      const hot = b.kind === 'player';
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      if (hot) {
        g.addColorStop(0, 'rgba(255,255,255,0.95)');
        g.addColorStop(0.35, 'rgba(160,240,255,0.7)');
        g.addColorStop(0.8, 'rgba(63,216,255,0.25)');
        g.addColorStop(1, 'rgba(63,216,255,0)');
      } else if (b.kind === 'chain') {
        g.addColorStop(0, 'rgba(255,255,255,0.9)');
        g.addColorStop(0.4, 'rgba(255,170,190,0.6)');
        g.addColorStop(1, 'rgba(255,72,112,0)');
      } else {
        g.addColorStop(0, 'rgba(255,240,200,0.9)');
        g.addColorStop(0.4, 'rgba(255,140,80,0.6)');
        g.addColorStop(1, 'rgba(255,72,60,0)');
      }
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      if (hot) {
        ctx.strokeStyle = 'rgba(160,240,255,' + Math.min(0.6, b.r / b.max) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.02, 0, Math.PI * 2); ctx.stroke();
      }
    }
    for (const p of particles) {
      const a = Math.max(0, p.life / p.max);
      ctx.fillStyle = 'rgba(' + p.color + ',' + a + ')';
      ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
    ctx.restore();
  }

  function text(str, x, y, size, color, align, weight, spacing) {
    ctx.font = (weight || 500) + ' ' + size + 'px ' + MONO;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    if (spacing && 'letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
    ctx.fillText(str, x, y);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  function drawHUD() {
    const showScore = mode !== 'attract';
    text(showScore ? String(score).padStart(6, '0') : 'Z9 PERIMETER', 22, 24, 16, C.ice, 'left', 700, 2);
    text('WAVE ' + wave, W / 2, 24, 13, 'rgba(159,233,255,0.7)', 'center', 500, 3);
    text('HI ' + String(high).padStart(6, '0'), W - 22, 24, 13, 'rgba(159,233,255,0.7)', 'right', 500, 2);

    if (banner && mode !== 'gameover') {
      const a = Math.min(1, banner.t * 2, (2 - banner.t) * 4);
      ctx.globalAlpha = Math.max(0, a);
      text(banner.text, W / 2, 210, 34, C.ice, 'center', 700, 8);
      text(banner.sub, W / 2, 248, 13, C.cyan, 'center', 500, 4);
      ctx.globalAlpha = 1;
    }

    if (tally && mode === 'playing') {
      text('WAVE ' + wave + ' CLEARED', W / 2, 190, 26, C.ice, 'center', 700, 6);
      text('INTERCEPTORS  ' + tally.ammoLeft + ' × ' + (5 * mult) + '  =  ' + tally.ammoBonus, W / 2, 238, 14, C.cyan, 'center', 500, 2);
      text('NODES INTACT  ' + tally.hubsLeft + ' × ' + (100 * mult) + '  =  ' + tally.hubBonus, W / 2, 264, 14, C.cyan, 'center', 500, 2);
      if (tally.restored) text('BONUS NODE RESTORED', W / 2, 298, 13, '#ffd9a0', 'center', 700, 3);
    }

    if (mode === 'attract') {
      const pulse = 0.65 + 0.35 * Math.sin(time * 3);
      ctx.fillStyle = 'rgba(4,6,12,0.55)';
      roundRect(W / 2 - 220, 300, 440, 110, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(63,216,255,0.3)'; ctx.lineWidth = 1; ctx.stroke();
      text('Z9 PERIMETER', W / 2, 336, 26, C.ice, 'center', 700, 8);
      ctx.globalAlpha = pulse;
      text('CLICK OR TAP TO DEFEND THE GRID', W / 2, 378, 13, C.cyan, 'center', 500, 3);
      ctx.globalAlpha = 1;
    }

    if (mode === 'gameover') {
      ctx.fillStyle = 'rgba(4,6,12,0.6)';
      roundRect(W / 2 - 220, 170, 440, 170, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(255,72,112,0.4)'; ctx.lineWidth = 1; ctx.stroke();
      text('GRID OFFLINE', W / 2, 212, 30, '#ff8fa8', 'center', 700, 8);
      text('SCORE  ' + score, W / 2, 256, 16, C.ice, 'center', 500, 3);
      text(score >= high && score > 0 ? 'NEW HIGH SCORE' : 'HIGH  ' + high, W / 2, 282, 13, score >= high && score > 0 ? '#ffd9a0' : 'rgba(159,233,255,0.7)', 'center', 500, 3);
      if (overTimer > 1.2) {
        ctx.globalAlpha = 0.65 + 0.35 * Math.sin(time * 3);
        text('CLICK TO PLAY AGAIN', W / 2, 314, 13, C.cyan, 'center', 500, 3);
        ctx.globalAlpha = 1;
      }
    }

    if (paused) {
      ctx.fillStyle = 'rgba(4,6,12,0.6)';
      ctx.fillRect(0, 0, W, H);
      text('PAUSED', W / 2, H / 2 - 10, 30, C.ice, 'center', 700, 10);
      text('PRESS P OR CLICK TO RESUME', W / 2, H / 2 + 28, 12, C.cyan, 'center', 500, 3);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCrosshair() {
    if (mode !== 'playing' || !pointer.inside || paused) return;
    const { x, y } = pointer;
    ctx.strokeStyle = C.ice; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(x, y, 9, 0, Math.PI * 2);
    ctx.moveTo(x - 15, y); ctx.lineTo(x - 5, y);
    ctx.moveTo(x + 5, y); ctx.lineTo(x + 15, y);
    ctx.moveTo(x, y - 15); ctx.lineTo(x, y - 5);
    ctx.moveTo(x, y + 5); ctx.lineTo(x, y + 15);
    ctx.stroke();
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
    drawBackground();
    drawProjectiles();
    drawGround();
    drawHubs();
    drawBatteries();
    drawBlasts();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawHUD();
    drawCrosshair();
  }

  // ---------- Sound (synthesized, no files) ----------
  let ac = null, master = null, noiseBuf = null, muted = false;
  function initAudio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0.35; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, freq, vol) {
    if (!ac || muted) return;
    const t0 = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, t0);
    f.frequency.exponentialRampToValueAtTime(60, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur);
  }
  const sfx = {
    launch: () => tone(900, 220, 0.18, 'triangle', 0.18),
    blast: () => noise(0.5, 2400, 0.35),
    pop: () => { tone(520, 1400, 0.09, 'square', 0.05); noise(0.25, 3000, 0.15); },
    boom: hit => { noise(hit ? 1.1 : 0.7, hit ? 900 : 600, hit ? 0.9 : 0.5); tone(120, 40, 0.6, 'sine', 0.4); },
    empty: () => tone(180, 140, 0.08, 'square', 0.06),
    wave: () => { tone(440, 440, 0.12, 'triangle', 0.12); tone(660, 660, 0.18, 'triangle', 0.12, 0.13); },
    clear: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'triangle', 0.1, i * 0.09)),
    over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.98, 0.3, 'sawtooth', 0.07, i * 0.22)),
  };

  const muteBtn = document.getElementById('mute');
  try { muted = localStorage.getItem('z9-perimeter-muted') === '1'; } catch (e) {}
  muteBtn.setAttribute('aria-pressed', String(muted));
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
    try { localStorage.setItem('z9-perimeter-muted', muted ? '1' : '0'); } catch (e) {}
  });

  // ---------- Input ----------
  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  canvas.addEventListener('pointermove', e => { const p = toWorld(e); pointer.x = p.x; pointer.y = p.y; pointer.inside = true; });
  canvas.addEventListener('pointerleave', () => { pointer.inside = false; });
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    const p = toWorld(e);
    pointer.x = p.x; pointer.y = p.y; pointer.inside = e.pointerType === 'mouse';
    if (paused) { paused = false; return; }
    if (mode === 'attract') { newGame(false); return; }
    if (mode === 'gameover') { if (overTimer > 1.2) newGame(false); return; }
    fire(p.x, p.y);
  });
  window.addEventListener('keydown', e => {
    if (mode !== 'playing') return;
    const k = e.key.toLowerCase();
    const idx = { a: 0, s: 1, d: 2, '1': 0, '2': 1, '3': 2 }[k];
    if (idx != null && pointer.inside && !paused) { initAudio(); fire(pointer.x, pointer.y, idx); e.preventDefault(); }
    if (k === 'p' || k === 'escape') { paused = !paused; e.preventDefault(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'playing') paused = true; });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(frame);
  }
  newGame(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
