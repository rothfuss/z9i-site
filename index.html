<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Z9 Innovation</title>
  <meta name="description" content="Z9 Innovation LLC — advanced technology and innovation consulting.">
  <meta name="theme-color" content="#78bdf0" id="themeColor">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #b9def7;
      --footer-text: rgba(245, 242, 235, 0.92);
      --footer-strong: #ffffff;
      --footer-line: rgba(255, 255, 255, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      position: relative;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      background: var(--page);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    canvas.playing { cursor: none; }

    .controls {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 3;
      display: flex;
      gap: 8px;
    }
    .controls > button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(13, 18, 36, 0.16);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.78);
      -webkit-backdrop-filter: blur(6px);
              backdrop-filter: blur(6px);
      color: #0d1224;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(13, 18, 36, 0.08);
      transition: background .15s, border-color .15s;
    }
    .controls > button:hover { background: #fff; border-color: rgba(13, 18, 36, 0.35); }
    .controls button:focus-visible { outline: 2px solid #1f6fc6; outline-offset: 2px; }
    .controls > button[hidden] { display: none; }
    .controls svg { width: 18px; height: 18px; }
    .controls .alt { display: none; }
    .controls button[aria-pressed="true"] .main { display: none; }
    .controls button[aria-pressed="true"] .alt { display: block; }

    .menu {
      position: absolute;
      top: 50px;
      right: 0;
      width: 270px;
      max-width: calc(100vw - 28px);
      padding: 8px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      -webkit-backdrop-filter: blur(12px);
              backdrop-filter: blur(12px);
      border: 1px solid rgba(13, 18, 36, 0.12);
      box-shadow: 0 12px 40px rgba(13, 18, 36, 0.22);
      color: #0d1224;
    }
    .menu[hidden] { display: none; }
    .menu h2 {
      margin: 4px 8px 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(13, 18, 36, 0.55);
    }
    .menu button {
      width: 100%;
      display: grid;
      grid-template-columns: 44px 1fr 16px;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    .menu button:hover { background: rgba(13, 18, 36, 0.06); }
    .menu .sw {
      width: 44px;
      height: 32px;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(13, 18, 36, 0.12);
    }
    .menu .name { display: block; font-size: 14px; font-weight: 600; }
    .menu .desc { display: block; font-size: 12px; color: rgba(13, 18, 36, 0.6); line-height: 1.3; }
    .menu .check { opacity: 0; color: #1f6fc6; }
    .menu button[aria-checked="true"] .check { opacity: 1; }

    footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 18px;
      padding: 10px 16px max(10px, env(safe-area-inset-bottom));
      color: var(--footer-text);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }
    footer p { margin: 0; }
    footer strong { font-weight: 600; color: var(--footer-strong); }
    footer .dot { opacity: .5; }
    footer a {
      pointer-events: auto;
      color: var(--footer-strong);
      text-decoration: none;
      border-bottom: 1px solid var(--footer-line);
      padding-bottom: 1px;
    }
    footer a:hover { border-bottom-color: var(--footer-strong); }
    @media (max-width: 640px) {
      footer { flex-direction: column; font-size: 13px; }
      footer .dot { display: none; }
      footer strong { display: block; }
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Z9 Innovation</h1>
  <canvas id="game" aria-label="Playable missile-defense game. Click or tap to launch interceptors."></canvas>

  <div class="controls">
    <button id="pause" type="button" aria-pressed="false" aria-label="Pause game" hidden>
      <svg class="main" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg class="alt" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <button id="themeBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu" aria-label="Change theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.3-.3-.3-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7" r="1.2" fill="currentColor"/></svg>
    </button>
    <button id="mute" type="button" aria-pressed="false" aria-label="Mute sound">
      <svg class="main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      <svg class="alt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    </button>
    <div class="menu" id="themeMenu" role="menu" aria-label="Themes" hidden>
      <h2>Theme</h2>
    </div>
  </div>

  <footer id="footer">
    <p><strong>Z9 Innovation LLC</strong> <span class="dot">&middot; </span>Advanced technology &amp; innovation consulting</p>
    <a href="mailto:rothfuss@z9i.com">rothfuss@z9i.com</a>
  </footer>

<script>
(() => {
  'use strict';

  // =====================================================================
  //  Setup & utilities
  // =====================================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const footerEl = document.getElementById('footer');
  const pauseBtn = document.getElementById('pause');
  const muteBtn = document.getElementById('mute');
  const themeBtn = document.getElementById('themeBtn');
  const themeMenu = document.getElementById('themeMenu');
  const touchOnly = window.matchMedia('(hover: none)').matches;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const MONO = '"JetBrains Mono", ui-monospace, monospace';
  const SANS = 'Inter, system-ui, sans-serif';
  const BLOCK = '"Archivo Black", "Arial Black", Impact, sans-serif';

  function srand(seed) {
    let s = (seed * 2654435761) >>> 0 || 1;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  function hexRgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(h, f) { // f > 0 lighten toward white, f < 0 darken toward black
    const c = hexRgb(h);
    const t = f > 0 ? 255 : 0, k = Math.abs(f);
    return 'rgb(' + c.map(v => Math.round(v + (t - v) * k)).join(',') + ')';
  }
  const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  function lerpHex(list, t) {
    const x = clamp(t, 0, 1) * (list.length - 1), i = Math.min(list.length - 2, Math.floor(x)), f = x - i;
    const a = hexRgb(list[i]), b = hexRgb(list[i + 1]);
    return '#' + a.map((v, k) => Math.round(v + (b[k] - v) * f).toString(16).padStart(2, '0')).join('');
  }

  // Geometry shared by the engine and every theme
  let W = 0, H = 0, G = 0, u = 1, R = 40, dpr = 1, textY = 300, time = 0;
  const brand = { x: 0, top: 0, w: 0, h: 0, wordY: 0, wordSize: 16, bottom: 0 };

  function mkCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w * dpr));
    c.height = Math.max(1, Math.ceil(h * dpr));
    const x = c.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    return [c, x];
  }

  // Drawing helpers in "u" units relative to a city's centre x0 on the ground line
  const box = (c, x0, dx, dy, w, h, fill) => { c.fillStyle = fill; c.fillRect(x0 + dx * u, G - (dy + h) * u, w * u, h * u); };
  function poly(c, x0, pts, fill, stroke, lw) {
    c.beginPath();
    pts.forEach(([dx, dy], k) => k ? c.lineTo(x0 + dx * u, G - dy * u) : c.moveTo(x0 + dx * u, G - dy * u));
    c.closePath();
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke(); }
  }
  const circ = (c, x, y, r, fill) => { c.fillStyle = fill; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); };
  function vgrad(c, y0, y1, stops) {
    const g = c.createLinearGradient(0, y0, 0, y1);
    stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
    return g;
  }
  function hgrad(c, x0, x1, stops) {
    const g = c.createLinearGradient(x0, 0, x1, 0);
    stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
    return g;
  }
  function windowGrid(c, x0, dx, dy, w, h, cols, rows, lit, dark, seed) {
    const rnd = srand(seed);
    const cw = w / cols, rh = h / rows;
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      const on = rnd() > 0.35;
      const flick = on ? 0.75 + 0.25 * Math.sin(time * 0.7 + r * 3 + k * 7 + seed) : 1;
      c.globalAlpha = flick;
      box(c, x0, dx + k * cw + cw * 0.22, dy + r * rh + rh * 0.25, cw * 0.56, rh * 0.5, on ? lit : dark);
    }
    c.globalAlpha = 1;
  }
  function gearPath(c, x, y, r, teeth, rot) {
    const inner = r * 0.78;
    c.beginPath();
    for (let i = 0; i < teeth * 2; i++) {
      const a0 = rot + (i / (teeth * 2)) * TAU, a1 = rot + ((i + 1) / (teeth * 2)) * TAU;
      const rr = i % 2 ? inner : r;
      c.lineTo(x + Math.cos(a0) * rr, y + Math.sin(a0) * rr);
      c.lineTo(x + Math.cos(a1) * rr, y + Math.sin(a1) * rr);
    }
    c.closePath();
    c.moveTo(x + r * 0.32, y);
    c.arc(x, y, r * 0.32, 0, TAU, true);
  }
  function cloudShape(c, x, y, s) {
    const puffs = [[-44, 4, 24], [-20, -12, 30], [10, -20, 36], [40, -6, 28], [-2, 6, 30], [26, 8, 24], [58, 8, 18]];
    c.beginPath();
    for (const [dx, dy, r] of puffs) { c.moveTo(x + (dx + r) * s, y + dy * s); c.arc(x + dx * s, y + dy * s, r * s, 0, TAU); }
  }
  function drawCloud(c, x, y, s, top, bottom) {
    cloudShape(c, x, y, s);
    c.fillStyle = vgrad(c, y - 56 * s, y + 32 * s, [top, top, bottom]);
    c.fill();
  }
  // Irregular blob for watercolor washes
  function blob(c, x, y, rx, ry, rnd, wob) {
    const n = 28, ph = rnd() * TAU, ph2 = rnd() * TAU;
    c.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * TAU;
      const k = 1 + (wob || 0.12) * (Math.sin(a * 3 + ph) * 0.6 + Math.sin(a * 5 + ph2) * 0.4) + (rnd() - 0.5) * (wob || 0.12) * 0.6;
      const px = x + Math.cos(a) * rx * k, py = y + Math.sin(a) * ry * k;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath();
  }
  function wash(c, x, y, rx, ry, color, alpha, seed, passes) {
    const rnd = srand(seed);
    for (let p = 0; p < (passes || 4); p++) {
      blob(c, x + (rnd() - 0.5) * rx * 0.15, y + (rnd() - 0.5) * ry * 0.15, rx * (0.85 + rnd() * 0.2), ry * (0.85 + rnd() * 0.2), rnd, 0.16);
      c.globalAlpha = alpha;
      c.fillStyle = color; c.fill();
      c.globalAlpha = alpha * 0.6;
      c.strokeStyle = color; c.lineWidth = 1.5; c.stroke();
    }
    c.globalAlpha = 1;
  }
  // Base-mound ground profile shared by several themes
  function groundPath(c, bump, flatTop) {
    c.beginPath();
    c.moveTo(0, H + 2);
    c.lineTo(0, G);
    const bt = baseTop();
    for (const fx of T.baseFx) {
      const x = fx * W, w = (bump || 56) * u;
      c.lineTo(x - w, G);
      if (flatTop) {
        c.lineTo(x - w * 0.45, bt); c.lineTo(x + w * 0.45, bt);
      } else {
        c.bezierCurveTo(x - w * 0.6, G, x - w * 0.55, bt, x - w * 0.3, bt);
        c.lineTo(x + w * 0.3, bt);
        c.bezierCurveTo(x + w * 0.55, bt, x + w * 0.6, G, x + w, G);
        continue;
      }
      c.lineTo(x + w, G);
    }
    c.lineTo(W, G);
    c.lineTo(W, H + 2);
    c.closePath();
  }
  function rubble(c, x0, a, b, ember) {
    poly(c, x0, [[-24, 0], [-16, 6], [-8, 3], [2, 10], [12, 4], [18, 7], [24, 0]], a);
    poly(c, x0, [[-14, 0], [-6, 4], [4, 2], [10, 0]], b);
    c.fillStyle = ember || ('rgba(240,110,60,' + (0.55 + 0.3 * Math.sin(time * 4 + x0)) + ')');
    c.fillRect(x0 - 9 * u, G - 3 * u, 2.5 * u, 2 * u);
    c.fillRect(x0 + 7 * u, G - 4 * u, 2 * u, 2 * u);
  }
  function drawDrone(c, f, color, light) {
    const dir = Math.sign(f.vx);
    c.save();
    c.translate(f.x, f.y + Math.sin(time * 3 + f.x * 0.01) * 2 * u);
    c.scale(dir * u, u);
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(16, 0); c.lineTo(4, -4); c.lineTo(-12, -4); c.lineTo(-16, -9);
    c.lineTo(-18, -9); c.lineTo(-16, 0); c.lineTo(-18, 5); c.lineTo(-12, 4); c.lineTo(4, 4);
    c.closePath(); c.fill();
    c.fillRect(-6, -12, 4, 24);
    c.fillStyle = (Math.floor(time * 4) % 2) ? light : '#ffffff';
    c.beginPath(); c.arc(-4, 0, 1.8, 0, TAU); c.fill();
    c.restore();
  }
  function cityShake(c) { return c.hitT ? Math.max(0, 1 - (time - c.hitT) * 3) : 0; }

  // =====================================================================
  //  Themes
  // =====================================================================
  const STD_CITIES = [0.215, 0.3, 0.385, 0.615, 0.7, 0.785];
  const STD_BASES = [0.08, 0.5, 0.92];

  // ---------- 1. Daybreak: bright, modern glass city ----------
  const daybreak = {
    id: 'daybreak', name: 'Daybreak', desc: 'Sunrise sky, glass towers, neon tracers',
    swatch: 'linear-gradient(160deg,#78bdf0,#ffe3c8 60%,#ff4d8d)',
    page: '#b9def7', meta: '#78bdf0',
    ink: '#0d1224',
    footer: ['rgba(240,246,255,0.9)', '#ffffff', 'rgba(255,255,255,0.4)'],
    cityFx: STD_CITIES, baseFx: STD_BASES, baseH: 28,
    prompt: 'Defend the six cities. Each base holds ten interceptors.',
    threat: [236, 38, 110], smart: [255, 140, 0], abm: [0, 150, 255], abmHead: '#0d1224', marker: ['#0d1224', '#0096ff'],
    blast: ['rgba(255,255,255,0.98)', 'rgba(255,224,102,0.9)', 'rgba(255,128,64,0.6)', 'rgba(255,64,129,0)'],
    fx: { spark: '255,150,60', debris: '40,70,130', smoke: '90,100,120', city: '127,227,255' },
    ui: { text: '#0d1224', muted: 'rgba(13,18,36,0.6)', panel: 'rgba(255,255,255,0.86)', line: 'rgba(13,18,36,0.12)', ptext: '#0d1224', pmuted: 'rgba(13,18,36,0.62)', accent: '#0080e0', warn: '#d81b60', gold: '#c76a00' },
    init() {
      this.skylines = STD_CITIES.map((_, i) => {
        const rnd = srand(i + 11), towers = [];
        let x = -24;
        while (x < 20) {
          const w = 6 + Math.floor(rnd() * 6);
          towers.push({ x, w, h: 14 + Math.floor(rnd() * 30), hue: Math.floor(rnd() * 4), spire: rnd() < 0.35 });
          x += w + 1.5;
        }
        return towers;
      });
    },
    backdrop(o) {
      o.fillStyle = vgrad(o, 0, G, ['#6fb8ef', '#a9d6f6', '#d9ecf6', '#ffe3c8', '#ffc9a6']);
      o.fillRect(0, 0, W, H);
      const sx = W * 0.78, sy = G * 0.74;
      const sg = o.createRadialGradient(sx, sy, 0, sx, sy, 240 * u);
      sg.addColorStop(0, 'rgba(255,248,214,1)'); sg.addColorStop(0.18, 'rgba(255,236,190,0.9)'); sg.addColorStop(1, 'rgba(255,214,170,0)');
      o.fillStyle = sg; o.fillRect(0, 0, W, G);
      circ(o, sx, sy, 34 * u, '#fff6d6');
      // distant skyline layers
      const layers = [['rgba(120,160,210,0.28)', 90, 1], ['rgba(90,130,195,0.32)', 55, 2]];
      for (const [col, hmax, seed] of layers) {
        const rnd = srand(seed * 77);
        o.fillStyle = col;
        for (let x = 0; x < W;) {
          const w = (14 + rnd() * 26) * u, h = (14 + rnd() * hmax) * u;
          o.fillRect(x, G - h, w, h);
          if (rnd() < 0.2) o.fillRect(x + w / 2 - u, G - h - 10 * u, 2 * u, 10 * u);
          x += w + rnd() * 6 * u;
        }
      }
    },
    ambient(c) {
      for (const cl of clouds) drawCloud(c, cl.x, cl.y, cl.s * u, 'rgba(255,255,255,0.95)', 'rgba(214,228,245,0.85)');
    },
    foreground(o) {
      groundPath(o);
      o.fillStyle = vgrad(o, baseTop(), H, ['#2a4f8f', '#14284f', '#0c1a35']);
      o.fill();
      o.strokeStyle = '#7fe3ff'; o.lineWidth = 2; o.stroke();
      o.save(); o.clip();
      o.strokeStyle = 'rgba(255,255,255,0.12)'; o.lineWidth = 6 * u;
      o.beginPath(); o.moveTo(0, G + 6 * u); o.lineTo(W, G + 6 * u); o.stroke();
      o.restore();
    },
    city(c, i, x0, alive) {
      if (!alive) return rubble(c, x0, '#3a4766', '#56638a');
      const hues = [['#7fe6f2', '#1fa2c2'], ['#9cc8ff', '#2f6fd6'], ['#b9b0ff', '#5a52d6'], ['#8ff0d4', '#1f9e8c']];
      for (const tw of this.skylines[i]) {
        const [l, d] = hues[tw.hue];
        const x = x0 + tw.x * u, w = tw.w * u, h = tw.h * u;
        c.fillStyle = hgrad(c, x, x + w, [l, d]);
        c.fillRect(x, G - h, w, h);
        c.fillStyle = 'rgba(255,255,255,0.35)';
        c.fillRect(x + w * 0.15, G - h, w * 0.12, h);
        windowGrid(c, x0, tw.x, 2, tw.w, tw.h - 4, Math.max(1, Math.floor(tw.w / 3)), Math.floor(tw.h / 4), 'rgba(255,255,255,0.85)', 'rgba(10,40,80,0.25)', i * 31 + tw.x);
        if (tw.spire) {
          box(c, x0, tw.x + tw.w / 2 - 0.5, tw.h, 1, 7, d);

    makeSprite(ch, color, ruined, seed) {
      const [mc, m] = mkCanvas(4, 4);

      let met = m.measureText(ch);
      const asc0 = met.actualBoundingBoxAscent || fs * 0.72;
      fs *= this.letterH / asc0;
      m.font = fs + 'px ' + BLOCK;
      met = m.measureText(ch);

  const THEMES = [daybreak, laramie, monument, steam, water];
  let T = daybreak;

  // Interceptor stock: pyramid of ten (4-3-2-1)
  function pips(c, b, x, y, on, off, round) {
    let k = 0;
    for (let row = 0; row < 4; row++) {
      const n = 4 - row;
      for (let q = 0; q < n; q++, k++) {
        const px = x + (q - (n - 1) / 2) * 6 * u, py = y + (3 - row) * 4.5 * u;
        c.fillStyle = (b.alive && k < b.ammo) ? on : off;
        if (round) { c.beginPath(); c.arc(px, py + 1.6 * u, 1.6 * u, 0, TAU); c.fill(); }
        else c.fillRect(px - 1.2 * u, py, 2.4 * u, 3.2 * u);
      }
    }
  }

  // =====================================================================
  //  Layout
  // =====================================================================
  let backLayer = null, frontLayer = null, logoImg = null, logoTint = null;

  const baseTop = () => T.baseTop ? T.baseTop() : G - (T.baseH || 28) * u;
  const cityHitY = c => T.cityHitY ? T.cityHitY(c) : G - 2;
  const cityHalf = () => T.cityHalf ? T.cityHalf() : 27 * u;
  const baseHalf = () => T.baseHalf ? T.baseHalf() : 42 * u;

  function layout() {
    const oldW = W, oldG = G, oldR = R;
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    footerEl.style.minHeight = '';
    const band = Math.max(footerEl.offsetHeight + (T.id === 'monument' ? 16 : 0), clamp(H * 0.1, 60, 96));
    footerEl.style.minHeight = band + 'px';
    G = H - band;
    u = clamp(Math.min(W / 1200, H / 820), 0.6, 1.45);
    R = clamp(Math.min(W * 0.05, G * 0.075), 24, 62);

    brand.w = clamp(Math.min(W * 0.24, H * 0.34), 120, 280);
    brand.h = brand.w * 411 / 720;
    brand.top = clamp(H * 0.1, 56, 120);
    brand.x = W / 2;
    brand.wordSize = clamp(Math.min(W * 0.024, H * 0.034), 15, 28);
    brand.wordY = brand.top + brand.h + clamp(H * 0.016, 8, 16) + brand.wordSize / 2;
    brand.bottom = brand.wordY + brand.wordSize / 2;
    textY = clamp(brand.bottom + Math.max(36, H * 0.06), H * 0.3, G * 0.62);

    if (oldW && (oldW !== W || oldG !== G)) rescale(W / oldW, G / oldG, R / oldR);
    buildLayers();
  }

  function buildLayers() {
    if (!W) return;
    T.layout && T.layout();
    T.build && T.build();
    let c;
    [backLayer, c] = mkCanvas(W, H); T.backdrop(c);
    [frontLayer, c] = mkCanvas(W, H); T.foreground(c);
    tintLogo();
  }

  function tintLogo() {
    if (!logoImg || !logoImg.complete || !logoImg.naturalWidth) return;
    const [lc, l] = mkCanvas(brand.w, brand.h);
    l.drawImage(logoImg, 0, 0, brand.w, brand.h);
    l.globalCompositeOperation = 'source-in';
    l.fillStyle = T.ink; l.fillRect(0, 0, brand.w, brand.h);
    logoTint = lc;
  }

  function rescale(kx, ky, kr) {
    const sc = o => {
      if (o.x != null) o.x *= kx; if (o.y != null) o.y *= ky;
      if (o.sx != null) o.sx *= kx; if (o.sy != null) o.sy *= ky;
      if (o.tx != null) o.tx *= kx; if (o.ty != null) o.ty *= ky;
      if (o.vx != null) o.vx *= kx; if (o.vy != null) o.vy *= ky;
      if (o.split != null) o.split *= ky;
      if (o.pts) o.pts.forEach(p => { p[0] *= kx; p[1] *= ky; });
      if (o.drops) o.drops = o.drops.map(d => d * kx);
      if (o.r != null) o.r *= kr; if (o.max != null && o.kind) o.max *= kr;
      if (o.left != null) o.left *= Math.hypot(kx, ky) / Math.SQRT2;
    };
    [threats, shots, blasts, particles, ghosts, markers, flyers, clouds].forEach(list => list && list.forEach(sc));
  }

  // =====================================================================
  //  Game state & rules
  // =====================================================================
  let cities = [], bases = [], threats = [], shots = [], blasts = [], particles = [], ghosts = [], markers = [], flyers = [], clouds = [];
  let mode = 'attract', phase = 'wave', paused = false;
  let score = 0, wave = 0, mult = 1, nextBonus = 10000, high = 0;
  let remaining = 0, salvoTimer = 0, sinceSalvo = 0, waveTargets = [];
  let tally = null, tallyTimer = 0, banner = null, shake = 0;
  let overTimer = 0, demoOverTimer = 0, endingTimer = -1, aiTimer = 0;
  const pointer = { x: 0, y: 0, inside: false };
  try { high = parseInt(localStorage.getItem('z9-high') || '0', 10) || 0; } catch (e) {}

  const cityX = c => c.fx * W;
  const baseX = b => b.fx * W;
  const fallTime = () => Math.max(4.2, 16 / (1 + 0.2 * (wave - 1)));
  const multFor = w => Math.min(1 + Math.floor((w - 1) / 2), 6);

  function makeClouds() {
    clouds = Array.from({ length: 6 }, (_, i) => ({ x: rand(0, W), y: rand(0.1, 0.62) * G, s: rand(0.7, 1.5), v: rand(5, 12) * (i % 2 ? 1 : 0.6) }));
  }

  function makeCities() { return T.cityFx.map((fx, i) => ({ fx, i, alive: true, hitT: 0 })); }

  function chooseTargets() {
    const alive = cities.filter(c => c.alive).sort(() => Math.random() - 0.5).slice(0, 3);
    const dead = cities.filter(c => !c.alive);
    if (alive.length < 3 && dead.length) alive.push(pick(dead));
    waveTargets = alive.map(c => ({ ref: c, type: 'city' })).concat(bases.map(b => ({ ref: b, type: 'base' })));
  }

  function newGame(demo) {
    mode = demo ? 'attract' : 'playing';
    cities = makeCities();
    bases = T.baseFx.map((fx, i) => ({ fx, i, ammo: 10, alive: true, fast: i === 1 }));
    threats = []; shots = []; blasts = []; particles = []; ghosts = []; markers = []; flyers = [];
    score = 0; wave = 0; nextBonus = 10000; overTimer = 0; demoOverTimer = 0; endingTimer = -1;
    paused = false;
    syncButtons();
    startWave();
  }

  function startWave() {
    wave++;
    mult = multFor(wave);
    bases.forEach(b => { b.alive = true; b.ammo = 10; });
    remaining = Math.min(12 + 2 * (wave - 1), 30);
    salvoTimer = 2.2;
    sinceSalvo = 0;
    phase = 'wave';
    chooseTargets();
    banner = { title: 'WAVE ' + wave, sub: mult + '× POINTS', t: 2.4 };
    if (mode === 'playing') sfx.wave();
  }

  function targetPoint() {
    const t = pick(waveTargets);
    if (t.type === 'city') return { x: cityX(t.ref) + rand(-5, 5) * u, y: cityHitY(t.ref) };
    return { x: baseX(t.ref) + rand(-8, 8) * u, y: baseTop() };
  }

  function spawnThreat(sx, sy, kind, canSplit) {
    const tp = targetPoint();
    const vy = G / fallTime() * (kind === 'smart' ? 1.15 : rand(0.92, 1.08));
    const dur = Math.max(0.3, (tp.y - sy) / vy);
    const t = { sx, sy, x: sx, y: sy, tx: tp.x, ty: tp.y, vx: (tp.x - sx) / dur, vy, kind, pts: [[sx, sy]], split: null, targeted: false, dodge: 0 };
    if (canSplit && kind === 'normal' && wave >= 2 && Math.random() < Math.min(0.1 + wave * 0.03, 0.35)) t.split = rand(0.28, 0.55) * G;
    threats.push(t);
  }

  function launchSalvo() {
    const n = Math.min(remaining, 3 + ((Math.random() * 2) | 0) + Math.floor(wave / 4), 8);
    let smarts = 0;
    for (let i = 0; i < n; i++) {
      const smart = wave >= 6 && smarts < 2 && Math.random() < 0.14;
      if (smart) smarts++;
      spawnThreat(rand(0.04, 0.96) * W, -2, smart ? 'smart' : 'normal', true);
    }
    remaining -= n;
    sinceSalvo = 0;
    if (wave >= 2 && flyers.length === 0 && Math.random() < 0.35) spawnFlyer();
  }

  function spawnFlyer() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    flyers.push({
      x: dir > 0 ? -40 : W + 40, y: rand(0.3, 0.5) * G, vx: dir * W / rand(8, 11), kind: 'flyer',
      drops: Array.from({ length: 1 + ((Math.random() * 2) | 0) }, () => rand(0.2, 0.8) * W),
    });
  }

  const shotSpeed = b => G / (b.fast ? 0.7 : 1.35);

  function fire(x, y, idx) {
    if (paused || phase !== 'wave') return false;
    y = Math.min(y, baseTop() - 34 * u);
    let base = null;
    if (idx != null) {
      const b = bases[idx];
      if (b && b.alive && b.ammo > 0) base = b;
    } else {
      let best = Infinity;
      for (const b of bases) {
        if (!b.alive || b.ammo <= 0) continue;
        const d = Math.abs(baseX(b) - x);
        if (d < best) { best = d; base = b; }
      }
    }
    if (!base) { if (mode === 'playing') sfx.empty(); return false; }
    base.ammo--;
    const sx = baseX(base), sy = baseTop() - 6 * u;
    const d = Math.hypot(x - sx, y - sy), sp = shotSpeed(base);
    shots.push({ sx, sy, x: sx, y: sy, tx: x, ty: y, vx: (x - sx) / d * sp, vy: (y - sy) / d * sp, left: d });
    markers.push({ x, y, t: 0 });
    if (mode === 'playing') sfx.launch(base.fast);
    return true;
  }

  const addBlast = (x, y, max, kind) => blasts.push({ x, y, max, kind, t: 0, r: 0, seed: Math.random() });

  function burst(x, y, n, rgb, speed, life, size) {
    if (particles.length > 800) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rand(0.2, 1) * speed;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.25, life: rand(0.5, 1) * life, max: life, rgb, size: size || 2, rot: Math.random() * TAU });
    }
  }

  const ghost = (t, rgb) => ghosts.push({ pts: t.pts.concat([[t.x, t.y]]), rgb, a: 1 });
  const addScore = n => { if (mode === 'playing') score += n * mult; };

  function killThreat(i) {
    const t = threats[i];
    threats.splice(i, 1);
    ghost(t, t.kind === 'smart' ? T.smart : T.threat);
    addBlast(t.x, t.y, R * 0.72, 'chain');
    burst(t.x, t.y, 10, T.fx.spark, 110 * u, 0.8);
    addScore(t.kind === 'smart' ? 125 : 25);
    if (mode === 'playing') sfx.pop();
  }

  function killFlyer(i) {
    const f = flyers[i];
    flyers.splice(i, 1);
    addBlast(f.x, f.y, R * 0.9, 'chain');
    burst(f.x, f.y, 24, T.fx.debris, 160 * u, 1.1, 2.5);
    addScore(100);
    if (mode === 'playing') sfx.pop();
  }

  function impact(t) {
    ghost(t, t.kind === 'smart' ? T.smart : T.threat);
    addBlast(t.x, t.y, R * 0.8, 'ground');
    burst(t.x, t.y, 18, T.fx.spark, 150 * u, 1.0);
    burst(t.x, t.y, 10, T.fx.smoke, 50 * u, 1.8, 3);
    let hit = false;
    const ch = cityHalf(), bh = baseHalf();
    for (const c of cities) {
      if (c.alive && Math.abs(cityX(c) - t.x) < ch) {
        c.alive = false; c.hitT = time; hit = true;
        burst(cityX(c), cityHitY(c) - 6 * u, 36, T.fx.city, 190 * u, 1.4);
        burst(cityX(c), cityHitY(c), 16, T.fx.debris, 120 * u, 1.4, 3);
      }
    }
    for (const b of bases) {
      if (b.alive && Math.abs(baseX(b) - t.x) < bh) {
        b.alive = false; b.ammo = 0; hit = true;
        burst(baseX(b), baseTop(), 28, T.fx.city, 170 * u, 1.2);
      }
    }
    if (!reduceMotion) shake = Math.max(shake, hit ? 8 : 3);
    if (mode === 'playing') sfx.boom(hit);
  }

  function endWave() {
    const ammoLeft = bases.reduce((s, b) => s + (b.alive ? b.ammo : 0), 0);
    const citiesLeft = cities.filter(c => c.alive).length;
    const ammoBonus = ammoLeft * 5 * mult, cityBonus = citiesLeft * 100 * mult;
    let restored = 0;
    if (mode === 'playing') {
      score += ammoBonus + cityBonus;
      while (score >= nextBonus) {
        nextBonus += 10000;
        const dead = cities.find(c => !c.alive);
        if (dead) { dead.alive = true; restored++; }
      }
      sfx.clear();
    }
    tally = { ammoLeft, citiesLeft, ammoBonus, cityBonus, restored };
    phase = 'tally';
    tallyTimer = mode === 'playing' ? 3.4 : 1.8;
  }

  function gameOver() {
    mode = 'gameover';
    overTimer = 0;
    paused = false;
    syncButtons();
    if (score > high) {
      high = score;
      try { localStorage.setItem('z9-high', String(high)); } catch (e) {}
    }
    sfx.over();
  }

  function runAI(dt) {
    aiTimer -= dt;
    if (aiTimer > 0 || phase !== 'wave') return;
    aiTimer = rand(0.3, 0.7);
    const cands = threats.filter(t => !t.targeted && t.y > G * 0.12).sort((a, b) => b.y - a.y);
    for (const t of cands) {
      let best = null, bd = Infinity;
      for (const b of bases) {
        const d = Math.abs(baseX(b) - t.x);
        if (b.alive && b.ammo > 0 && d < bd) { bd = d; best = b; }
      }
      if (!best) return;
      let px = t.x, py = t.y;
      for (let k = 0; k < 3; k++) {
        const tt = Math.hypot(px - baseX(best), py - baseTop()) / shotSpeed(best) + 0.25;
        px = t.x + t.vx * tt; py = t.y + t.vy * tt;
      }
      if (py > baseTop() - 40 * u) continue;
      if (fire(px + rand(-5, 5), py + rand(-5, 5), bases.indexOf(best))) {
        threats.forEach(o => { if (Math.hypot(o.x - px, o.y - py) < R * 1.2) o.targeted = true; });
        t.targeted = true;
      }
      return;
    }
  }

  function update(dt) {
    time += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 20);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 220) c.x = -220; }
    T.tick && T.tick(dt);

    const anyCity = cities.some(c => c.alive);

    if (mode !== 'gameover') {
      if (phase === 'wave') {
        sinceSalvo += dt;
        if (remaining > 0 && anyCity) {
          salvoTimer -= dt;
          const lowest = threats.reduce((m, t) => Math.min(m, t.y), Infinity);
          const ready = threats.length === 0 || lowest > G * 0.42 || sinceSalvo > fallTime() * 0.7;
          if (salvoTimer <= 0 && ready && sinceSalvo > 1.5) launchSalvo();
        } else if (!threats.length && !shots.length && !blasts.length && !flyers.length && anyCity) {
          endWave();
        }
      } else if (phase === 'tally') {
        tallyTimer -= dt;
        if (tallyTimer <= 0) { tally = null; startWave(); }
      }
    }
    if (mode === 'attract') runAI(dt);

    for (let i = threats.length - 1; i >= 0; i--) {
      const t = threats[i];
      if (t.kind === 'smart') {
        let push = 0;
        for (const b of blasts) {
          if (b.kind === 'ground') continue;
          const dx = t.x - b.x, dy = t.y - b.y, d = Math.hypot(dx, dy);
          if (d < b.max + R * 0.9 && d > b.r * 0.8) push += Math.sign(dx || 1);
        }
        if (push) {
          t.x = clamp(t.x + Math.sign(push) * G / fallTime() * 2.2 * dt, 10, W - 10);
          t.dodge += dt;
          if (t.dodge > 0.12) { t.pts.push([t.x, t.y]); t.dodge = 0; }
          t.vx = (t.tx - t.x) / Math.max(0.1, (t.ty - t.y) / t.vy);
        }
      }
      t.x += t.vx * dt; t.y += t.vy * dt;
      if (t.split != null && t.y >= t.split) {
        threats.splice(i, 1);
        const n = 2 + ((Math.random() * 2) | 0);
        for (let k = 0; k < n; k++) {
          spawnThreat(t.x, t.y, 'normal', false);
          threats[threats.length - 1].pts = t.pts.concat([[t.x, t.y]]);
        }
        continue;
      }
      if (t.y >= t.ty) { threats.splice(i, 1); impact(t); }
    }

    for (let i = flyers.length - 1; i >= 0; i--) {
      const f = flyers[i], px = f.x;
      f.x += f.vx * dt;
      for (let k = f.drops.length - 1; k >= 0; k--) {
        const d = f.drops[k];
        if ((px - d) * (f.x - d) <= 0) { f.drops.splice(k, 1); if (anyCity) spawnThreat(f.x, f.y + 8 * u, 'normal', false); }
      }
      if (f.x < -70 || f.x > W + 70) flyers.splice(i, 1);
    }

    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      s.left -= Math.hypot(s.vx, s.vy) * dt;
      if (s.left <= 0) {
        shots.splice(i, 1);
        addBlast(s.tx, s.ty, R, 'player');
        const mi = markers.findIndex(m => m.x === s.tx && m.y === s.ty);
        if (mi >= 0) markers.splice(mi, 1);
        if (mode === 'playing') sfx.blast();
      } else { s.x += s.vx * dt; s.y += s.vy * dt; }
    }

    for (let i = blasts.length - 1; i >= 0; i--) {
      const b = blasts[i];
      b.t += dt;
      const g = 0.45, h = 0.1, f = 0.45;
      if (b.t < g) b.r = b.max * Math.sin((b.t / g) * Math.PI / 2);
      else if (b.t < g + h) b.r = b.max;
      else if (b.t < g + h + f) b.r = b.max * (1 - (b.t - g - h) / f);
      else { blasts.splice(i, 1); continue; }
      if (b.kind === 'ground') continue;
      const r2 = b.r * b.r;
      for (let j = threats.length - 1; j >= 0; j--) {
        const t = threats[j], dx = t.x - b.x, dy = t.y - b.y;
        if (dx * dx + dy * dy < r2) killThreat(j);
      }
      for (let j = flyers.length - 1; j >= 0; j--) {
        const fl = flyers[j], dx = fl.x - b.x, dy = fl.y - b.y, rr = b.r + 12 * u;
        if (dx * dx + dy * dy < rr * rr) killFlyer(j);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += 120 * u * dt; p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 4;
      if (p.y > G) { p.y = G; p.vy *= -0.25; }
    }
    for (let i = ghosts.length - 1; i >= 0; i--) { ghosts[i].a -= dt * 0.9; if (ghosts[i].a <= 0) ghosts.splice(i, 1); }
    markers.forEach(m => m.t += dt);

    for (const c of cities) {
      if (!c.alive && Math.random() < dt * 2.5 && particles.length < 800) {
        particles.push({ x: cityX(c) + rand(-14, 14) * u, y: G - 3, vx: rand(-6, 6), vy: rand(-36, -18) * u, life: 1.2, max: 1.2, rgb: T.fx.smoke, size: 2.5, rot: 0 });
      }
    }

    if (!anyCity && mode !== 'gameover') {
      if (mode === 'playing') {
        if (endingTimer < 0) endingTimer = 0;
        endingTimer += dt;
        if (endingTimer > 1.6) gameOver();
      } else {
        demoOverTimer += dt;
        if (demoOverTimer > 3) newGame(true);
      }
    }
    if (mode === 'gameover') { overTimer += dt; if (overTimer > 16) newGame(true); }
  }

  // =====================================================================
  //  Rendering
  // =====================================================================
  function path(pts, x, y) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (x != null) ctx.lineTo(x, y);
  }

  function drawBrand() {
    if (logoTint) {
      ctx.save();
      if (T.brandShadow) { ctx.shadowColor = T.brandShadow; ctx.shadowBlur = 14; ctx.shadowOffsetY = 2; }
      ctx.drawImage(logoTint, brand.x - brand.w / 2, brand.top, brand.w, brand.h);
      ctx.restore();
    }
    ctx.save();
    if (T.brandShadow) { ctx.shadowColor = T.brandShadow; ctx.shadowBlur = 10; ctx.shadowOffsetY = 1; }
    ctx.font = '600 ' + brand.wordSize + 'px "Cormorant Garamond", Georgia, serif';
    ctx.fillStyle = T.ink;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    const word = 'INNOVATION', sp = brand.wordSize * 0.62;
    const widths = [...word].map(ch => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + sp * (word.length - 1);
    let x = brand.x - total / 2;
    [...word].forEach((ch, k) => { ctx.fillText(ch, x, brand.wordY); x += widths[k] + sp; });
    ctx.restore();
  }

  function drawTrails() {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const tw = (T.threatWidth || 1.6) * u, ta = T.threatAlpha || 0.42;
    for (const g of ghosts) {
      ctx.strokeStyle = rgba(g.rgb, ta * g.a);
      ctx.lineWidth = tw * 0.9;
      path(g.pts); ctx.stroke();
    }
    for (const t of threats) {
      const rgb = t.kind === 'smart' ? T.smart : T.threat;
      ctx.strokeStyle = rgba(rgb, ta);
      ctx.lineWidth = tw;
      path(t.pts, t.x, t.y); ctx.stroke();
      const last = t.pts[t.pts.length - 1];
      const k = Math.min(1, 70 * u / Math.max(1, Math.hypot(t.x - last[0], t.y - last[1])));
      const hx = t.x - (t.x - last[0]) * k, hy = t.y - (t.y - last[1]) * k;
      const g = ctx.createLinearGradient(hx, hy, t.x, t.y);
      g.addColorStop(0, rgba(rgb, ta)); g.addColorStop(1, rgba(rgb, 1));
      ctx.strokeStyle = g; ctx.lineWidth = tw * 1.3;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(t.x, t.y); ctx.stroke();
      if (T.head) T.head(ctx, t, rgb);
      else {
        if (t.kind === 'smart') {
          ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(time * 6);
          ctx.fillStyle = T.ui.ptext; const s = 5.5 * u;
          ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
        circ(ctx, t.x, t.y, 5.5 * u, rgba(rgb, 0.25));
        circ(ctx, t.x, t.y, 2.3 * u, rgba(rgb, 1));
      }
    }
    for (const s of shots) {
      ctx.strokeStyle = rgba(T.abm, T.abmAlpha || 0.75);
      ctx.lineWidth = (T.abmWidth || 1.7) * u;
      ctx.beginPath(); ctx.moveTo(s.sx, s.sy); ctx.lineTo(s.x, s.y); ctx.stroke();
      circ(ctx, s.x, s.y, 2.3 * u, T.abmHead);
    }
    for (const m of markers) {
      const r = 5 * u;
      ctx.strokeStyle = T.marker[Math.floor(m.t * 10) % 2];
      ctx.lineWidth = 1.6 * u;
      ctx.beginPath();
      ctx.moveTo(m.x - r, m.y - r); ctx.lineTo(m.x + r, m.y + r);
      ctx.moveTo(m.x + r, m.y - r); ctx.lineTo(m.x - r, m.y + r);
      ctx.stroke();
    }
  }

  function drawBlasts() {
    for (const b of blasts) {
      if (b.r < 0.5) continue;
      if (T.blastDraw) { T.blastDraw(ctx, b); continue; }
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      if (b.kind === 'ground') {
        g.addColorStop(0, 'rgba(255,246,220,0.95)'); g.addColorStop(0.45, 'rgba(245,140,70,0.85)'); g.addColorStop(1, 'rgba(200,60,50,0)');
      } else {
        const flick = Math.floor(time * 14 + b.seed * 3) % 3;
        const st = T.blast;
        g.addColorStop(0, st[0]);
        g.addColorStop(0.38 + flick * 0.04, st[1]);
        g.addColorStop(0.8, st[2]);
        g.addColorStop(1, st[3]);
      }
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      if (b.kind === 'player') {
        ctx.strokeStyle = 'rgba(255,255,255,' + 0.5 * (b.r / b.max) + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.04, 0, TAU); ctx.stroke();
      }
      T.blastExtra && T.blastExtra(ctx, b);
    }
    const shape = T.fx.shape;
    for (const p of particles) {
      const a = Math.max(0, p.life / p.max), s = p.size * u;
      ctx.fillStyle = 'rgba(' + p.rgb + ',' + a + ')';
      if (shape === 'gear' && p.size >= 2 && p.rgb !== T.fx.smoke) { gearPath(ctx, p.x, p.y, s * 1.4, 6, p.rot); ctx.fill('evenodd'); }
      else if (shape === 'circle') { ctx.beginPath(); ctx.arc(p.x, p.y, s * 0.7, 0, TAU); ctx.fill(); }
      else ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
  }

  function txt(str, x, y, size, color, opts) {
    opts = opts || {};
    ctx.font = (opts.weight || 500) + ' ' + size + 'px ' + (opts.font || MONO);
    ctx.textAlign = opts.align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    if ('letterSpacing' in ctx) ctx.letterSpacing = (opts.spacing || 0) + 'px';
    if (opts.shadow) { ctx.shadowColor = opts.shadow; ctx.shadowBlur = 6; ctx.shadowOffsetY = 1; }
    ctx.fillText(str, x, y);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  function panel(cx, cy, w, h) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.12)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 4;
    ctx.fillStyle = T.ui.panel;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 14); else ctx.rect(cx - w / 2, cy - h / 2, w, h);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = T.ui.line; ctx.lineWidth = 1; ctx.stroke();
  }

  function drawHUD() {
    const ui = T.ui, sh = ui.shadow;
    const pad = Math.max(16, 20 * u);
    const big = clamp(18 * u, 15, 24), small = clamp(11 * u, 10, 14);
    if (mode !== 'attract') {
      txt(String(score).padStart(6, '0'), pad, pad + big / 2, big, ui.text, { align: 'left', weight: 700, spacing: 2, shadow: sh });
      txt('WAVE ' + wave + '  ·  ' + mult + '×', pad, pad + big + small + 4, small, ui.muted, { align: 'left', spacing: 2, shadow: sh });
      txt('HIGH ' + String(Math.max(high, score)).padStart(6, '0'), pad, pad + big + small * 2 + 10, small, ui.muted, { align: 'left', spacing: 2, shadow: sh });
    } else if (high > 0) {
      txt('HIGH ' + String(high).padStart(6, '0'), pad, pad + small / 2, small, ui.muted, { align: 'left', spacing: 2, shadow: sh });
    }

    const cx = W / 2, pw = Math.min(W - 32, 440);
    const t1 = clamp(22 * u, 17, 28), t2 = clamp(12 * u, 11, 14);

    if (mode === 'attract') {
      ctx.font = t2 + 'px ' + SANS;
      const aw = Math.min(W - 24, Math.max(ctx.measureText(T.prompt).width, touchOnly ? 0 : 440) + 48);
      panel(cx, textY + t2 * 1.75, aw, t2 * 6.6);
      ctx.globalAlpha = 0.65 + 0.35 * Math.sin(time * 2.6);
      txt(touchOnly ? 'TAP ANYWHERE TO PLAY' : 'CLICK ANYWHERE TO PLAY', cx, textY, t2 + 1, ui.ptext, { weight: 600, font: SANS, spacing: 4 });
      ctx.globalAlpha = 1;
      txt(T.prompt, cx, textY + t2 * 2.1, t2, ui.pmuted, { font: SANS });
      txt(touchOnly ? 'Change the look with the palette button above.' : 'A  S  D  fire from a chosen base   ·   P  pause   ·   T  theme', cx, textY + t2 * 3.8, t2 - 1, ui.pmuted, { font: touchOnly ? SANS : MONO, spacing: touchOnly ? 0 : 1 });
    }

    if (banner && mode === 'playing' && phase === 'wave') {
      ctx.globalAlpha = clamp(Math.min(banner.t * 2, (2.4 - banner.t) * 4), 0, 1);
      panel(cx, textY + t1 * 0.6, Math.min(pw, 300), t1 * 3.4);
      txt(banner.title, cx, textY + t1 * 0.1, t1, ui.ptext, { weight: 700, spacing: 6 });
      txt(banner.sub, cx, textY + t1 * 1.3, t2, ui.accent, { spacing: 3 });
      ctx.globalAlpha = 1;
    }

    if (tally && mode === 'playing') {
      const lh = t2 * 2;
      panel(cx, textY + lh * 1.5, pw, lh * 5 + (tally.restored ? lh : 0));
      txt('WAVE ' + wave + ' COMPLETE', cx, textY, t1 * 0.85, ui.ptext, { weight: 700, spacing: 4 });
      txt('INTERCEPTORS  ' + tally.ammoLeft + ' × ' + 5 * mult + '  =  ' + tally.ammoBonus, cx, textY + lh * 1.4, t2, ui.pmuted, { spacing: 1 });
      txt((T.cityLabel || 'CITIES') + '  ' + tally.citiesLeft + ' × ' + 100 * mult + '  =  ' + tally.cityBonus, cx, textY + lh * 2.3, t2, ui.pmuted, { spacing: 1 });
      if (tally.restored) txt('BONUS ' + (T.cityLabel || 'CITIES').replace(/S$/, '').replace(/IE$/, 'Y') + ' RESTORED', cx, textY + lh * 3.4, t2, ui.gold, { weight: 700, spacing: 3 });
    }

    if (mode === 'gameover') {
      const lh = t2 * 2;
      panel(cx, textY + lh * 1.6, pw, lh * 5.4);
      txt('GAME OVER', cx, textY, t1, ui.warn, { weight: 700, spacing: 8 });
      txt('SCORE  ' + score, cx, textY + lh * 1.3, t2 + 2, ui.ptext, { weight: 700, spacing: 2 });
      const best = score >= high && score > 0;
      txt(best ? 'NEW HIGH SCORE' : 'HIGH  ' + high, cx, textY + lh * 2.2, t2, best ? ui.gold : ui.pmuted, { weight: best ? 700 : 500, spacing: 2 });
      if (overTimer > 1.2) {
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 2.6);
        txt(touchOnly ? 'TAP TO PLAY AGAIN' : 'CLICK TO PLAY AGAIN', cx, textY + lh * 3.3, t2, ui.accent, { weight: 600, font: SANS, spacing: 3 });
        ctx.globalAlpha = 1;
      }
    }

    if (paused) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(0, 0, W, G);
      panel(cx, textY + t1 * 0.7, Math.min(pw, 320), t1 * 3.6);
      txt('PAUSED', cx, textY + t1 * 0.2, t1, ui.ptext, { weight: 700, spacing: 8 });
      txt(touchOnly ? 'Tap ▶ to resume' : 'Press ▶ or P to resume', cx, textY + t1 * 1.45, t2, ui.pmuted, { font: SANS });
    }
  }

  function drawCrosshair() {
    if (mode !== 'playing' || !pointer.inside || paused) return;
    const { x, y } = pointer, s = Math.max(0.8, u);
    ctx.save();
    if (T.ui.shadow) { ctx.shadowColor = T.ui.shadow; ctx.shadowBlur = 4; }
    ctx.strokeStyle = T.ui.text; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(x, y, 8 * s, 0, TAU);
    ctx.moveTo(x - 14 * s, y); ctx.lineTo(x - 4 * s, y);
    ctx.moveTo(x + 4 * s, y); ctx.lineTo(x + 14 * s, y);
    ctx.moveTo(x, y - 14 * s); ctx.lineTo(x, y - 4 * s);
    ctx.moveTo(x, y + 4 * s); ctx.lineTo(x, y + 14 * s);
    ctx.stroke();
    ctx.restore();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (backLayer) ctx.drawImage(backLayer, 0, 0, W, H);
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
    T.ambient && T.ambient(ctx);
    drawBrand();
    drawTrails();
    for (const f of flyers) T.flyer(ctx, f);
    if (frontLayer) ctx.drawImage(frontLayer, 0, 0, W, H);
    cities.forEach(c => T.city(ctx, c.i, cityX(c), c.alive, c));
    const bt = baseTop();
    bases.forEach(b => T.base(ctx, b, baseX(b), bt));
    drawBlasts();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    T.overlay && T.overlay(ctx);
    drawHUD();
    drawCrosshair();
  }

  // =====================================================================
  //  Sound (synthesized)
  // =====================================================================
  let ac = null, master = null, noiseBuf = null, muted = false;
  function initAudio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0.3; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, freq, vol) {
    if (!ac || muted) return;
    const t0 = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, t0);
    f.frequency.exponentialRampToValueAtTime(60, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur);
  }
  const sfx = {
    launch: fast => tone(fast ? 1100 : 850, 220, fast ? 0.14 : 0.22, 'triangle', 0.16),
    blast: () => noise(0.7, 2200, 0.32),
    pop: () => { tone(500, 1300, 0.08, 'square', 0.04); noise(0.3, 2800, 0.14); },
    boom: hit => { noise(hit ? 1.2 : 0.7, hit ? 900 : 600, hit ? 0.85 : 0.45); tone(110, 40, 0.6, 'sine', 0.35); },
    empty: () => tone(180, 140, 0.08, 'square', 0.05),
    wave: () => { tone(440, 440, 0.12, 'triangle', 0.1); tone(660, 660, 0.2, 'triangle', 0.1, 0.13); },
    clear: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'triangle', 0.09, i * 0.09)),
    over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.98, 0.32, 'sawtooth', 0.06, i * 0.24)),
  };

  // =====================================================================
  //  Themes: selection
  // =====================================================================
  function applyTheme(id, save) {
    const next = THEMES.find(t => t.id === id) || daybreak;
    const prev = T;
    T = next;
    if (!T._init) { T.init && T.init(); T._init = true; }
    const root = document.documentElement.style;
    root.setProperty('--page', T.page);
    root.setProperty('--footer-text', T.footer[0]);
    root.setProperty('--footer-strong', T.footer[1]);
    root.setProperty('--footer-line', T.footer[2]);
    document.getElementById('themeColor').setAttribute('content', T.meta);
    if (save) { try { localStorage.setItem('z9-theme', T.id); } catch (e) {} }
    themeMenu.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.id === T.id)));

    if (cities.length && prev !== T) {
      // Carry the game across: same bases, cities remapped to the new skyline
      const frac = cities.filter(c => c.alive).length / cities.length;
      const fresh = makeCities();
      const keep = Math.round(frac * fresh.length);
      fresh.forEach((c, k) => { c.alive = k < keep; });
      fresh.sort(() => Math.random() - 0.5).forEach((c, k) => { c.fx = T.cityFx[k]; c.i = k; });
      cities = fresh.sort((a, b) => a.i - b.i);
      bases.forEach((b, k) => { b.fx = T.baseFx[k]; });
      chooseTargets();
      threats.forEach(t => { if (t.ty > G - 60 * u) { /* keep heading */ } });
    }
    if (W) layout();
  }

  THEMES.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'menuitemradio');
    b.dataset.id = t.id;
    b.innerHTML = '<span class="sw" style="background:' + t.swatch + '"></span><span><span class="name">' + t.name + '</span><span class="desc">' + t.desc + '</span></span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
    b.addEventListener('click', () => { applyTheme(t.id, true); closeMenu(); });
    themeMenu.appendChild(b);
  });

  let pausedByMenu = false;
  function openMenu() {
    themeMenu.hidden = false;
    themeBtn.setAttribute('aria-expanded', 'true');
    if (mode === 'playing' && !paused) { pausedByMenu = true; setPaused(true); }
    const cur = themeMenu.querySelector('[aria-checked="true"]');
    (cur || themeMenu.querySelector('button')).focus();
  }
  function closeMenu() {
    if (themeMenu.hidden) return;
    themeMenu.hidden = true;
    themeBtn.setAttribute('aria-expanded', 'false');
    if (pausedByMenu) { pausedByMenu = false; setPaused(false); }
  }
  themeBtn.addEventListener('click', e => { e.stopPropagation(); themeMenu.hidden ? openMenu() : closeMenu(); });
  document.addEventListener('pointerdown', e => { if (!themeMenu.hidden && !themeMenu.contains(e.target) && e.target !== themeBtn && !themeBtn.contains(e.target)) closeMenu(); }, true);

  // =====================================================================
  //  Controls
  // =====================================================================
  function syncButtons() {
    pauseBtn.hidden = mode !== 'playing';
    pauseBtn.setAttribute('aria-pressed', String(paused));
    pauseBtn.setAttribute('aria-label', paused ? 'Resume game' : 'Pause game');
    canvas.classList.toggle('playing', mode === 'playing' && !paused);
  }
  function setPaused(p) {
    if (mode !== 'playing') return;
    paused = p;
    syncButtons();
  }
  pauseBtn.addEventListener('click', () => { initAudio(); pausedByMenu = false; setPaused(!paused); });

  try { muted = localStorage.getItem('z9-muted') === '1'; } catch (e) {}
  muteBtn.setAttribute('aria-pressed', String(muted));
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
    try { localStorage.setItem('z9-muted', muted ? '1' : '0'); } catch (e) {}
  });

  canvas.addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = e.pointerType === 'mouse'; });
  canvas.addEventListener('pointerleave', () => { pointer.inside = false; });
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = e.pointerType === 'mouse';
    if (paused) { pausedByMenu = false; setPaused(false); return; }
    if (mode === 'attract') { newGame(false); return; }
    if (mode === 'gameover') { if (overTimer > 1.2) newGame(false); return; }
    fire(e.clientX, e.clientY);
  });
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'escape' && !themeMenu.hidden) { closeMenu(); themeBtn.focus(); return; }
    if (e.target && e.target.closest && e.target.closest('.menu')) return;
    if (k === 't' && !e.metaKey && !e.ctrlKey) {
      const i = THEMES.indexOf(T);
      applyTheme(THEMES[(i + 1) % THEMES.length].id, true);
      return;
    }
    if (mode !== 'playing') return;
    if (k === 'p' || k === 'escape') { setPaused(!paused); e.preventDefault(); return; }
    const idx = { a: 0, s: 1, d: 2, '1': 0, '2': 1, '3': 2 }[k];
    if (idx != null && pointer.inside && !paused) { initAudio(); fire(pointer.x, pointer.y, idx); e.preventDefault(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 60); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (T.sprites !== undefined) T.sprites = null; layout(); });

  // =====================================================================
  //  Start
  // =====================================================================
  let startTheme = 'daybreak';
  try { startTheme = localStorage.getItem('z9-theme') || startTheme; } catch (e) {}
  const qp = new URLSearchParams(location.search).get('theme');
  if (qp && THEMES.some(t => t.id === qp)) startTheme = qp;

  applyTheme(startTheme, false);
  layout();
  makeClouds();
  newGame(true);

  logoImg = new Image();
  logoImg.onload = tintLogo;
  logoImg.src = 'logo.png';

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
