<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Z9 Innovation</title>
  <meta name="description" content="Z9 Innovation LLC — advanced technology and innovation consulting.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Z9 Innovation">
  <meta property="og:description" content="Advanced technology and innovation consulting.">
  <meta property="og:url" content="https://z9i.com/">
  <meta property="og:image" content="https://z9i.com/preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#9fd0f5" id="themeColor">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="modulepreload" href="js/core.js">
  <link rel="modulepreload" href="js/game.js">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cinzel:wght@700&family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #9fd0f5;
      --footer-text: rgba(240, 246, 255, 0.9);
      --footer-strong: #ffffff;
      --footer-line: rgba(255, 255, 255, 0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      position: relative;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      background: var(--page);
      transition: background-color .4s;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    canvas.aiming { cursor: none; }

    .controls {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 3;
      display: flex;
      gap: 8px;
    }
    .controls > button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(13, 18, 36, 0.16);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.82);
      -webkit-backdrop-filter: blur(8px);
              backdrop-filter: blur(8px);
      color: #0d1224;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(13, 18, 36, 0.12);
      transition: background .15s, border-color .15s, transform .15s;
    }
    .controls > button:hover { background: #fff; border-color: rgba(13, 18, 36, 0.35); transform: translateY(-1px); }
    .controls button:focus-visible { outline: 2px solid #1f6fc6; outline-offset: 2px; }
    .controls > button[hidden] { display: none; }
    .controls svg { width: 18px; height: 18px; }
    .controls .alt { display: none; }
    .controls button[aria-pressed="true"] .main { display: none; }
    .controls button[aria-pressed="true"] .alt { display: block; }

    .menu {
      position: absolute;
      top: 50px;
      right: 0;
      width: 280px;
      max-width: calc(100vw - 28px);
      max-height: calc(100dvh - 80px);
      overflow-y: auto;
      padding: 8px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.95);
      -webkit-backdrop-filter: blur(12px);
              backdrop-filter: blur(12px);
      border: 1px solid rgba(13, 18, 36, 0.12);
      box-shadow: 0 12px 40px rgba(13, 18, 36, 0.28);
      color: #0d1224;
    }
    .menu[hidden] { display: none; }
    .menu h2 {
      margin: 4px 8px 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(13, 18, 36, 0.55);
    }
    .menu button {
      width: 100%;
      display: grid;
      grid-template-columns: 44px 1fr 16px;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    .menu button:hover { background: rgba(13, 18, 36, 0.06); }
    .menu .sw {
      width: 44px;
      height: 32px;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(13, 18, 36, 0.14);
    }
    .menu .name { display: block; font-size: 14px; font-weight: 600; }
    .menu .desc { display: block; font-size: 12px; color: rgba(13, 18, 36, 0.62); line-height: 1.3; }
    .menu .check { width: 16px; height: 16px; opacity: 0; color: #1f6fc6; }
    .menu button[aria-checked="true"] .check { opacity: 1; }

    footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 18px;
      padding: 10px 16px max(10px, env(safe-area-inset-bottom));
      color: var(--footer-text);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    footer p { margin: 0; }
    footer strong { font-weight: 600; color: var(--footer-strong); }
    footer .dot { opacity: .5; }
    footer a {
      pointer-events: auto;
      color: var(--footer-strong);
      text-decoration: none;
      border-bottom: 1px solid var(--footer-line);
      padding-bottom: 1px;
    }
    footer a:hover { border-bottom-color: var(--footer-strong); }
    @media (max-width: 640px) {
      footer { flex-direction: column; font-size: 13px; }
      footer .dot { display: none; }
      footer strong { display: block; }
    }
    noscript {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 22px; color: #0d1224; text-align: center; padding: 24px;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Z9 Innovation</h1>
  <noscript>Z9 Innovation</noscript>
  <canvas id="game" aria-label="Playable missile-defense game. Click or tap to launch interceptors."></canvas>

  <div class="controls">
    <button id="pause" type="button" aria-pressed="false" aria-label="Pause game" hidden>
      <svg class="main" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg class="alt" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <button id="themeBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu" aria-label="Change theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.3-.3-.3-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7" r="1.2" fill="currentColor"/></svg>
    </button>
    <button id="mute" type="button" aria-pressed="true" aria-label="Turn sound on">
      <svg class="main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      <svg class="alt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    </button>
    <div class="menu" id="themeMenu" role="menu" aria-label="Themes" hidden>
      <h2>Theme</h2>
    </div>
  </div>

  <footer id="footer">
    <p><strong>Z9 Innovation LLC</strong> <span class="dot">&middot; </span>Advanced technology &amp; innovation consulting</p>
    <a href="mailto:rothfuss@z9i.com">rothfuss@z9i.com</a>
  </footer>

  <script type="module" src="js/game.js"></script>
</body>
</html>
